<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prologue A — L'offre</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* PROLOGUE A — « L'offre ». Plans subjectifs (POV de Viktor) en 2,5D : nuit bleue, souvenir ambré. */
  .pro { --amb: #f2b36b; --amb2: #ffd9a0; --red: #e04848; --pol: #f2c21b; --wh: #f1f4ea; --dim: rgba(215,220,207,.55); }
  .pro .shot { position: absolute; inset: 0; opacity: 0; overflow: hidden; transition: opacity .3s; }
  .pro .shot.on { opacity: 1; }
  .pro .shot.on.out { opacity: 0; transition: opacity .25s; }
  .pro .hh { position: absolute; inset: 0; animation: pro-hh 7s ease-in-out infinite; }
  @keyframes pro-hh { 0%,100% { transform: translate(0,0) rotate(0) } 22% { transform: translate(.3cqw,-.18cqw) rotate(.22deg) }
      48% { transform: translate(-.12cqw,.24cqw) rotate(-.16deg) } 74% { transform: translate(-.3cqw,-.1cqw) rotate(.18deg) } }
  .pro svg text { font-family: 'Courier New', Courier, monospace; text-shadow: none; }

  /* ── cartons datés ── */
  .pro #sCard { background: rgba(3,4,7,.9); }
  .pro .card { position: absolute; left: 0; right: 0; top: 19.5cqw; text-align: center; }
  .pro .card .ck { font-size: 1.25cqw; letter-spacing: .55em; padding-left: .55em; color: rgba(215,220,207,.45); margin-bottom: 1.7cqw; }
  .pro .card .cd { font-size: 3.5cqw; letter-spacing: .22em; padding-left: .22em; color: var(--wh); min-height: 4.6cqw; }
  .pro .card .cur { display: inline-block; width: .55em; height: .9em; background: var(--wh); vertical-align: -.08em; margin-left: .12em; animation: k-blink .9s steps(2) infinite; }
  .pro .card .cl { width: 0; height: 2px; background: var(--red); margin: 1.5cqw auto 0; transition: width .8s cubic-bezier(.7,0,.2,1); }
  .pro .card .cl.on { width: 26cqw; }
  .pro .card .cs { font-size: 1.45cqw; letter-spacing: .45em; padding-left: .45em; color: var(--amb); margin-top: 1.4cqw; min-height: 2cqw; }

  /* ── POV 1 : la fenêtre de nuit sous la pluie ── */
  .pro #sWin { background: #030409; }
  .pro .city { position: absolute; inset: -3cqw; filter: blur(.2cqw) saturate(1.15); transition: filter 1.2s; }
  .pro .city svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pro .bok { position: absolute; inset: -3cqw; filter: blur(.45cqw); }
  .pro .bok i { position: absolute; border-radius: 50%; mix-blend-mode: screen; background: radial-gradient(circle, var(--c) 0 42%, transparent 70%); }
  .pro .wplane { position: absolute; inset: 0; transform: perspective(90cqw) rotateY(-7deg) scale(1.08); transform-origin: 30% 50%; }
  .pro .rain { position: absolute; inset: -12cqw; opacity: .6; animation: pro-rain .42s linear infinite;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='90'><g stroke='rgba(205,220,245,.6)' stroke-width='.7' stroke-linecap='round'><path d='M10 5 l-2 14'/><path d='M34 30 l-2.4 17'/><path d='M22 58 l-1.6 11'/><path d='M45 70 l-2 14'/></g></svg>");
      background-size: 5cqw 9cqw; }
  .pro .rain.r2 { opacity: .32; animation: pro-rain2 .7s linear infinite; background-size: 9cqw 16cqw; filter: blur(.08cqw); }
  @keyframes pro-rain { to { background-position: -1.2cqw 9cqw } }
  @keyframes pro-rain2 { to { background-position: -2.2cqw 16cqw } }
  .pro .drops { position: absolute; inset: 0; opacity: .75;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='rgba(220,232,255,.16)' stroke='rgba(235,242,255,.38)' stroke-width='.45'><circle cx='12' cy='20' r='1.6'/><circle cx='60' cy='12' r='1.1'/><circle cx='40' cy='55' r='2.3'/><circle cx='78' cy='70' r='1.3'/><circle cx='20' cy='78' r='.9'/><ellipse cx='70' cy='40' rx='1' ry='1.7'/><circle cx='50' cy='84' r='1.5'/></g></svg>");
      background-size: 8cqw 8cqw; }
  .pro .wf { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pro .curt { position: absolute; left: -4cqw; top: -2cqw; width: 13cqw; height: 62cqw; filter: blur(.7cqw);
      background: repeating-linear-gradient(90deg, #0c0b10 0 1.6cqw, #19161f 2.4cqw, #0c0b10 3.4cqw); }
  .pro .sillph { position: absolute; left: 13.5cqw; top: 36.4cqw; width: 6.2cqw; height: 5cqw; filter: blur(.12cqw); transform: perspective(40cqw) rotateY(18deg);
      background: #1a140f; box-shadow: inset 0 0 0 .45cqw #241b13; }
  .pro .sillph svg { position: absolute; inset: .45cqw; width: calc(100% - .9cqw); height: calc(100% - .9cqw); opacity: .55; }
  .pro .redw { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(224,40,40,.0), rgba(160,10,20,.45)); mix-blend-mode: multiply; opacity: 0; transition: opacity .4s; }
  .pro #sWin.later .city { filter: blur(.28cqw) saturate(.55) brightness(.62); }
  .pro #sWin.red .redw { opacity: 1; }
  .pro #sWin.red .city { filter: blur(.28cqw) saturate(1.4) brightness(.7) hue-rotate(-25deg); }

  /* ── la main et le téléphone (plan subjectif) ── */
  .pro .rig { position: absolute; left: 41cqw; top: 4cqw; width: 34cqw; height: 62cqw; z-index: 4; animation: pro-hh 4.6s ease-in-out infinite; pointer-events: none; }
  .pro .rpose { position: absolute; inset: 0; transform-origin: 50% 70%; transition: transform .9s cubic-bezier(.2,.8,.2,1);
      transform: perspective(80cqw) translateY(56cqw) rotateX(16deg) rotateY(-20deg) rotateZ(-12deg); }
  .pro .rig.on .rpose { transform: perspective(80cqw) rotateX(6deg) rotateY(-14deg) rotateZ(-4deg); }
  .pro .rig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .pro .rig .mob { left: 7cqw; top: 0; }
  .pro #thumb { transform-box: view-box; transform-origin: 305px 500px; transition: transform .28s cubic-bezier(.4,0,.2,1); }
  .pro .rig.press #thumb { transform: rotate(-21deg) scale(.97); }

  /* téléphone (en main) */
  /* isolation : les z-index internes (reflet, encoche) restent DANS le téléphone ; les doigts et le pouce repassent devant */
  .pro .mob { position: absolute; width: 20cqw; height: 41cqw; border-radius: 2.7cqw; text-shadow: none; isolation: isolate;
      background: linear-gradient(135deg, #2b303a, #0c0e12 45%, #171a20);
      box-shadow: inset 0 0 0 .16cqw #3b414d, inset 0 0 0 .34cqw #08090b, 0 1.4cqw 3cqw rgba(0,0,0,.7); }
  .pro .scr { position: absolute; inset: .7cqw; border-radius: 2.1cqw; overflow: hidden; background: radial-gradient(ellipse at 50% 18%, #1c2637 0%, #0a0e16 60%, #05070b 100%); }
  .pro .scr::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6;
      background: linear-gradient(118deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 36%, rgba(255,255,255,0) 72%, rgba(255,255,255,.05) 100%); }
  .pro .notch { position: absolute; left: 50%; top: 1.25cqw; width: 5.4cqw; height: 1.35cqw; margin-left: -2.7cqw; border-radius: 1cqw; background: #020203; z-index: 7; }
  .pro .p-sb { position: absolute; top: .75cqw; left: 1.5cqw; right: 1.4cqw; display: flex; justify-content: space-between; align-items: center; font-size: 1.1cqw; color: #e9ecef; }
  .pro .p-ic { display: flex; align-items: flex-end; gap: .14cqw; height: 1cqw; }
  .pro .p-ic i { width: .25cqw; background: #e9ecef; }
  .pro .p-ic i:nth-child(1) { height: 30% } .pro .p-ic i:nth-child(2) { height: 55% } .pro .p-ic i:nth-child(3) { height: 80% } .pro .p-ic i:nth-child(4) { height: 100%; opacity: .35 }
  .pro .p-ic b { width: 1.7cqw; height: .85cqw; margin-left: .45cqw; border: .1cqw solid #e9ecef; border-radius: .2cqw; background: linear-gradient(90deg, #e9ecef 0 35%, transparent 35%); }
  .pro .p-st { position: absolute; left: 0; right: 0; top: 4.2cqw; text-align: center; font-size: 1.15cqw; letter-spacing: .18em; padding-left: .18em; color: rgba(215,220,207,.62); }
  .pro .p-st .s2 { display: none; }
  .pro .p-av { position: absolute; left: 50%; top: 7.1cqw; width: 6.6cqw; height: 6.6cqw; margin-left: -3.3cqw; border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #2c3546, #121722); box-shadow: 0 0 0 .14cqw rgba(215,220,207,.22); }
  .pro .p-av svg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; clip-path: circle(50% at 50% 50%); }
  .pro .p-av em { position: absolute; left: 0; right: 0; top: 14%; height: 50%; line-height: 1; display: flex; align-items: center; justify-content: center; font-style: normal; font-family: Georgia, 'Times New Roman', serif;
      font-size: 3.6cqw; color: rgba(241,244,234,.85); padding: 0; }
  .pro .p-av s { position: absolute; inset: -.1cqw; border-radius: 50%; border: .14cqw solid rgba(143,209,158,.7); opacity: 0; }
  .pro .p-nm { position: absolute; left: 0; right: 0; top: 15.2cqw; text-align: center; font-size: 1.7cqw; font-weight: bold; letter-spacing: .06em; color: var(--wh); min-height: 2.2cqw; }
  .pro .p-in { position: absolute; left: 0; right: 0; top: 18.1cqw; text-align: center; font-size: 1.15cqw; letter-spacing: .15em; padding-left: .15em; color: rgba(215,220,207,.55); min-height: 1.5cqw; }
  .pro .p-tm, .pro .p-end { position: absolute; left: 0; right: 0; top: 20.4cqw; text-align: center; font-size: 1.45cqw; letter-spacing: .12em; }
  .pro .p-tm { color: #8fd19e; }
  .pro .p-end { color: #ff5d5d; opacity: 0; font-weight: bold; }
  .pro .p-row { position: absolute; left: 0; right: 0; top: 24.6cqw; display: flex; justify-content: center; gap: 1.5cqw; }
  .pro .p-row i { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: rgba(255,255,255,.1); position: relative; }
  .pro .p-row i svg { position: absolute; inset: 22%; width: 56%; height: 56%; }
  .pro .p-btn { position: absolute; top: 31.2cqw; width: 4.4cqw; height: 4.4cqw; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform .15s, filter .15s, opacity .2s; }
  .pro .p-btn svg { position: static; width: 56%; height: 56%; display: block; }
  .pro .p-btn.hang { left: 50%; margin-left: -2.2cqw; background: #e5383b; }
  .pro .p-btn.dec { left: 2.4cqw; background: #e5383b; display: none; }
  .pro .p-btn.acc { right: 2.4cqw; background: #34c759; display: none; }
  .pro .p-btn.acc svg { transform: none; }
  .pro .mob.end .p-tm { opacity: 0; }
  .pro .mob.end .p-end { opacity: 1; }
  .pro .mob.end .p-st, .pro .mob.end .p-av, .pro .mob.end .p-nm, .pro .mob.end .p-row, .pro .mob.end .p-in { opacity: .35; }
  .pro .mob.end .p-btn.hang { transform: scale(.86); filter: brightness(.7) saturate(.6); }

  /* ── sous-titres : l'étiquette du locuteur reste lisible même sur la lumière blanche ── */
  .pro .sub .spk { background: rgba(0,0,0,.55); padding: .15cqw .5cqw; }
</style>
</head>
<body>
<div class="wrap">
  <div class="st pro" id="st">
    <div class="bg"></div>
    <div class="scene" id="scene">

      <!-- symboles partagés : la photo de famille, le combiné, dégradés du cuir -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <linearGradient id="pro-lea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f333b"/><stop offset=".45" stop-color="#16181d"/><stop offset="1" stop-color="#0a0b0d"/></linearGradient>
          <linearGradient id="pro-slv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16171b"/><stop offset="1" stop-color="#060607"/></linearGradient>
          <linearGradient id="pro-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8dba8"/><stop offset=".5" stop-color="#f2ae66"/><stop offset=".72" stop-color="#dd7c48"/><stop offset="1" stop-color="#7a3a22"/></linearGradient>
          <linearGradient id="pro-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a2e"/><stop offset="1" stop-color="#3a1d14"/></linearGradient>
        </defs>
        <symbol id="pro-fam" viewBox="0 0 300 210">
          <rect width="300" height="210" fill="url(#pro-sky)"/>
          <circle cx="226" cy="146" r="25" fill="#fff0c4" opacity=".92"/>
          <circle cx="226" cy="146" r="40" fill="#ffe0a0" opacity=".25"/>
          <rect y="150" width="300" height="60" fill="url(#pro-sea)"/>
          <g stroke="#ffd79a" stroke-width="1.6" stroke-linecap="round" opacity=".75"><path d="M200 156 H252 M208 161 H244 M214 166 H238 M196 172 H226"/></g>
          <path d="M0 166 Q150 160 300 168 V210 H0Z" fill="#2c1610"/>
          <g fill="#20110c" stroke="#ffc98a" stroke-width=".7" stroke-opacity=".55">
            <!-- la mère -->
            <circle cx="128" cy="66" r="10.5"/>
            <path d="M120 58 C118 49 131 48 137 56 C135 61 132 63 129 62 C123 64 118 74 113 87 C110 93 104 93 101 90 C107 84 111 72 115 63 Z"/>
            <path d="M125 75 H131 V81 H125 Z"/>
            <path d="M118 80 C122 77 134 77 139 80 L143 96 L140 112 C146 127 151 141 155 153 L107 153 C111 140 115 126 118 112 L115 96 Z"/>
            <path d="M121 153 L123 169 L127 169 L126 153 Z M133 153 L136 169 L140 169 L138 153 Z"/>
            <path d="M137 84 C143 96 147 108 151 120 L147 122 C142 110 137 98 133 88 Z"/>

            <path d="M159 101 C162 99 172 99 175 101 L180 134 L154 134 Z"/>
            <path d="M159 134 L160 169 L164 169 L164 134 Z M170 134 L170 169 L174 169 L175 134 Z"/>
            <path d="M161 103 C157 110 154 116 152 123 L148 122 C150 114 153 107 157 101 Z"/>
            <path d="M173 103 C179 98 183 92 185 83 L189 84 C187 94 182 102 176 108 Z"/>
            <circle cx="187.5" cy="82" r="2.6"/>

          </g>
        </symbol>
        <!-- combiné téléphonique -->
        <symbol id="pro-hs" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z" fill="#fff"/></symbol><symbol id="pro-call" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" fill="#fff"/></symbol>
      </svg>

      <!-- carton daté -->
      <div class="shot" id="sCard">
        <div class="card">
          <div class="ck">MÉMOIRE · V.</div>
          <div class="cd"><span id="cd" data-reset></span><i class="cur"></i></div>
          <div class="cl" id="cl"></div>
          <div class="cs" id="cs" data-reset></div>

      <!-- POV : la fenêtre, la nuit, la pluie -->
      <div class="shot" id="sWin">
        <div class="hh">
          <div class="city"><svg id="citySvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"></svg></div>
          <div class="bok" id="bok"></div>
          <div class="wplane">
            <div class="rain r2"></div><div class="rain"></div><div class="drops"></div>
            <svg class="wf" viewBox="0 0 1000 562.5" preserveAspectRatio="none">
              <defs><linearGradient id="pro-sill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a33"/><stop offset=".25" stop-color="#14161b"/><stop offset="1" stop-color="#060709"/></linearGradient></defs>

              </g>

            </svg>
            <div class="sillph"><svg viewBox="0 0 300 210" preserveAspectRatio="xMidYMid slice"><use href="#pro-fam"/></svg></div>
          </div>
          <div class="curt"></div>
          <div class="redw"></div>

      </div>

      <!-- la main de Viktor qui tient le téléphone (paume derrière, doigts et pouce devant) -->
      <div class="rig" id="rig">

      <div class="sub" id="sub"></div>
    </div>

</div>
<script src="kit.js"></script>
<script>
  // ── fabrication : ville sous la pluie, bokeh, téléphone, doigts ──
  const $ = id => document.getElementById(id)
  const NS = 'http://www.w3.org/2000/svg'
  let seed = 7
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646 }

  ;(function city() {
    const s = $('citySvg')
    let h = '<defs><linearGradient id="pro-nite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04060c"/><stop offset=".55" stop-color="#0f1626"/><stop offset=".85" stop-color="#2a2230"/><stop offset="1" stop-color="#3a2a26"/></linearGradient></defs>'
    h += '<rect width="1000" height="600" fill="url(#pro-nite)"/>'
    // lointain
    for (let x = -20; x < 1020;) { const w = 40 + rnd() * 70, top = 250 + rnd() * 120; h += `<rect x="${x.toFixed(0)}" y="${top.toFixed(0)}" width="${(w + 1).toFixed(0)}" height="${(600 - top).toFixed(0)}" fill="#141b2b"/>`; x += w }
    // proche, avec fenêtres allumées
    for (let x = -30; x < 1030;) {
      const w = 70 + rnd() * 110, top = 150 + rnd() * 170
      h += `<rect x="${x.toFixed(0)}" y="${top.toFixed(0)}" width="${(w + 1).toFixed(0)}" height="${(600 - top).toFixed(0)}" fill="#0a0e18"/>`
      for (let wy = top + 16; wy < 590; wy += 24) for (let wx = x + 10; wx < x + w - 12; wx += 17) {
        const r = rnd(); if (r > .27) continue
        const c = r < .2 ? '#f2b36b' : r < .24 ? '#cfe0ff' : '#ff7a5a'
        h += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="7" height="10" fill="${c}" opacity="${(.45 + rnd() * .5).toFixed(2)}"/>`
      }
      if (rnd() < .3) h += `<circle cx="${(x + w / 2).toFixed(0)}" cy="${(top - 6).toFixed(0)}" r="3" fill="#ff3030"/>`
      x += w + 6
    }
    h += '<rect y="470" width="1000" height="130" fill="#3a2418" opacity=".35"/>'
    s.innerHTML = h
    const bok = $('bok'), cols = ['rgba(242,179,107,.9)', 'rgba(255,224,180,.8)', 'rgba(224,72,72,.75)', 'rgba(120,200,210,.6)', 'rgba(190,210,255,.7)']
    for (let i = 0; i < 28; i++) {
      const e = document.createElement('i'), sz = 1.8 + rnd() * 5
      e.style.cssText = `left:${(rnd() * 100).toFixed(1)}%;top:${(5 + rnd() * 80).toFixed(1)}%;width:${sz.toFixed(1)}cqw;height:${sz.toFixed(1)}cqw;--c:${cols[Math.floor(rnd() * cols.length)]};opacity:${(.18 + rnd() * .38).toFixed(2)}`
      bok.appendChild(e)
    }
  })()

  const HS = '<svg viewBox="0 0 24 24"><use href="#pro-hs"/></svg>'
  const ICO = [
    '<svg viewBox="0 0 20 20"><g fill="none" stroke="#e9ecef" stroke-width="1.6" stroke-linecap="round"><rect x="7" y="2" width="6" height="10" rx="3"/><path d="M4 9 Q4 15 10 15 Q16 15 16 9 M10 15 V18 M3 3 L17 17"/></g></svg>',
    '<svg viewBox="0 0 20 20"><g fill="#e9ecef"><circle cx="4" cy="4" r="1.7"/><circle cx="10" cy="4" r="1.7"/><circle cx="16" cy="4" r="1.7"/><circle cx="4" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="16" cy="10" r="1.7"/><circle cx="4" cy="16" r="1.7"/><circle cx="10" cy="16" r="1.7"/><circle cx="16" cy="16" r="1.7"/></g></svg>',
    '<svg viewBox="0 0 20 20"><g fill="none" stroke="#e9ecef" stroke-width="1.6" stroke-linecap="round"><path d="M3 8 H7 L12 4 V16 L7 12 H3 Z" fill="#e9ecef"/><path d="M14.5 7 Q16.5 10 14.5 13"/></g></svg>',
  ]
  const AV = '<svg viewBox="0 0 80 80"><path d="M40 18 C32 18 27 24 27 32 C27 39 30 44 34 46 L33 50 C22 52 14 58 12 68 L11 80 H69 L68 68 C66 58 58 52 47 50 L46 46 C50 44 53 39 53 32 C53 24 48 18 40 18 Z" fill="#2a3242"/></svg>'
  const phone = (id, clock) => `<div class="scr">
      <div class="p-sb"><span id="${id}c">${clock}</span><span class="p-ic"><i></i><i></i><i></i><i></i><b></b></span></div>
      <div class="p-st"><span class="s1">APPEL EN COURS</span></div>
      <div class="p-av">${AV}<em>?</em></div>
      <div class="p-nm" id="${id}n">NUMÉRO MASQUÉ</div>
      <div class="p-in" id="${id}i">INCONNU</div>
      <div class="p-tm" id="${id}t">00:04</div>
      <div class="p-end">APPEL TERMINÉ</div>
      <div class="p-row">${ICO.map(s => `<i>${s}</i>`).join('')}</div>
      <div class="p-btn hang">${HS}</div>
    </div><div class="notch"></div>`
  $('ph1').innerHTML = phone('ph1', '23:12')

  // doigts repliés sur le bord gauche du téléphone (main droite, vue subjective)
  ;[[196, 46, 46], [246, 46, 43], [296, 44, 45], [344, 38, 50]].forEach(([y, hgt, xo]) => {
    const p = document.createElementNS(NS, 'path'), a = y - hgt / 2, b = y + hgt / 2
    p.setAttribute('d', `M82 ${a} C62 ${a - 3} ${xo} ${a + 6} ${xo} ${y} C${xo} ${b - 6} 60 ${b + 2} 82 ${b} C88 ${b - 4} 88 ${a + 4} 82 ${a} Z`)
    $('fingers').appendChild(p)
  })

  // ── outils de mise en scène ──
  const G = (ms, p) => K => K.glitch(ms, p)
  const H = K => K.snd.heart()
  const hearts = (from, to, every) => { const a = []; for (let t = from; t <= to; t += every) a.push([t, H]); return a }
  const mmss = s => '00:' + String(s).padStart(2, '0')
  const clock = (K, id, from, n, guard) => { for (let i = 0; i < n; i++) K.at(i * 1000, () => { if (!guard || !$(guard).classList.contains('end')) $(id).textContent = mmss(from + i) }) }
  const rain = K => { K.snd.noise(6, .045, 3800, 'highpass', 0, .5); K.snd.noise(4, .03, 900, 'bandpass', .4, .6) }

  K.run({
    music: 'somber',
    stateClasses: ['press', 'end'],
    reset: K => { $('ph1n').textContent = 'NUMÉRO MASQUÉ'; $('ph1i').textContent = 'INCONNU'; $('ph1c').textContent = '23:12'; $('ph1t').textContent = '00:04' },
    beats: [
      // 1 — carton daté : le soir de l'offre
      { label: 'le 21 février', min: 2600, cues: [
          [100, K => K.crt()], [350, K => K.on('sCard')],
          [650, K => K.type('cd', '21 FÉVR. · 23:12', 1050, true)],
          [1800, K => K.on('cl')], [2000, K => K.type('cs', 'L\'OFFRE', 400, true)], [2450, G(160, .5)]] },
      // 2 — POV : le téléphone en main, la fenêtre sous la pluie
      { label: 'l\'offre', who: 'PHONE', name: 'NUMÉRO MASQUÉ', pre: 1300, post: 300,
        say: 'On sait ce que vous valez, Viktor. Un tir, cent mille. Personne ne saura.',
        cues: [
          [0, K => { K.glitch(260, .7); K.on('sCard', 'out'); K.on('sWin'); rain(K) }],
          [250, K => { K.on('rig'); K.snd.paper(); clock(K, 'ph1t', 4, 9, 'ph1') }],
          [2600, G(120, .45)], [4900, G(90, .4)]] },
      // 3 — le refus : le pouce raccroche
      { label: 'le refus', who: 'VIKTOR', post: 600, say: 'J\'ai raccroché. Je ne tue plus pour de l\'argent.',
        cues: [
          [250, K => K.on('rig', 'press')],
          [520, K => { K.on('ph1', 'end'); K.snd.tone(480, 'sine', .18, .12); K.snd.tone(480, 'sine', .18, .12, .25) }],
          [900, K => K.off('rig', 'press')], [3300, K => K.off('rig')]] },
      // 4 — trois semaines plus tard : le soir où il rentre (l'enquête jouable s'insérera juste après)
      { label: 'le 14 mars', who: 'VIKTOR', pre: 1900, post: 700, say: 'Trois semaines plus tard, je suis rentré plus tôt que prévu.',
        cues: [
          [0, K => { K.$('sub').textContent = ''; K.glitch(520, 1); K.shake(); K.on('sWin', 'out'); K.off('sCard', 'out'); K.off('cl'); K.$('cd').textContent = ''; K.$('cs').textContent = '' }],
          [200, K => K.type('cd', '14 MARS · 21:47', 650, true)], [950, K => K.on('cl')], [1050, K => K.type('cs', 'LE SILENCE', 400, true)],
          ...hearts(2000, 6200, 950)] },
      // 5 — le noir
      { label: 'le noir', min: 1600, cues: [
          [0, K => { K.$('sub').textContent = ''; H(K) }], [500, G(260, .8)], [800, K => K.black()]] },
    ],
  })
</script>
</body>
</html>
