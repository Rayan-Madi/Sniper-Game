<!doctype html><html><head><meta charset="utf-8"><title>Modèles — vérif</title>
<style>
  body{margin:0;background:#15171c;color:#cfe;font-family:system-ui,sans-serif}
  h1{font-size:16px;padding:12px 16px;margin:0;color:#9fb}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:12px}
  .card{background:#1e2128;border:1px solid #333;border-radius:8px;overflow:hidden}
  .card canvas{display:block;width:100%;height:240px;background:#0d0f13}
  .name{font-size:13px;padding:8px 10px;color:#ffd}
  .sub{font-size:11px;color:#89a;padding:0 10px 8px}
</style></head>
<body>
<h1>Modèles 3D — dis-moi lesquels enlever (clic droit → nom du fichier sous chaque perso)</h1>
<div class="grid" id="grid"></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

const MODELS = [
  'gangster_man_01.glb','gangster_man_02.glb','mafia_criminal_01.glb','mafia_boss.glb',
  'mafia_henchman.glb','mafia_woman_01.glb','mafia_woman_02.glb','mafia_woman_03.glb',
]
const loader = new GLTFLoader()
const grid = document.getElementById('grid')

for (const file of MODELS) {
  const card = document.createElement('div'); card.className = 'card'
  const cv = document.createElement('canvas')
  const name = document.createElement('div'); name.className = 'name'; name.textContent = file
  const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = 'chargement…'
  card.append(cv, name, sub); grid.appendChild(card)

  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true })
  renderer.setSize(cv.clientWidth || 240, 240, false)
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0f13)
  const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 100)
  scene.add(new THREE.AmbientLight(0xffffff, 0.9))
  const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(3, 6, 5); scene.add(dl)

  loader.load('/models/' + file, (g) => {
    const m = g.scene
    const box = new THREE.Box3().setFromObject(m)
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
    const s = 1.7 / (size.y || 1); m.scale.setScalar(s)
    m.position.set(-c.x * s, -box.min.y * s, -c.z * s)
    scene.add(m)
    cam.position.set(0, 1.1, 3.4); cam.lookAt(0, 1.0, 0)
    let mixer = null
    if (g.animations.length) {
      mixer = new THREE.AnimationMixer(m)
      const idle = g.animations.find(a => /idle/i.test(a.name)) || g.animations[0]
      mixer.clipAction(idle).play()
      sub.textContent = g.animations.length + ' anims : ' + g.animations.map(a=>a.name).slice(0,4).join(', ') + '…'
    } else sub.textContent = 'aucune animation'
    const clock = new THREE.Clock()
    ;(function loop(){ requestAnimationFrame(loop); const dt=clock.getDelta(); if(mixer)mixer.update(dt); m.rotation.y += dt*0.6; renderer.render(scene, cam) })()
  }, undefined, (e) => { sub.textContent = 'ERREUR de chargement' })
}
</script>
</body></html>
